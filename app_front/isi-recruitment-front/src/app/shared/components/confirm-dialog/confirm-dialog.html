@if (state(); as s) {
  <div class="confirm-backdrop" (click)="annuler()">
    <div class="confirm-panel" (click)="$event.stopPropagation()">
      <h3>{{ s.title }}</h3>
      <p>{{ s.message }}</p>
      <div class="confirm-actions">
        <button class="btn btn-outline" type="button" (click)="annuler()">{{ s.cancelLabel }}</button>
        <button
          class="btn"
          [class.btn-danger]="s.danger"
          [class.btn-primary]="!s.danger"
          type="button"
          (click)="confirmer()"
        >
          {{ s.confirmLabel }}
        </button>
      </div>
    </div>
  </div>
}
