<div class="page">
  <div class="page-header">
    <div>
      <h1>Modifier mes informations</h1>
      <p>Ces informations sont visibles par les recruteurs sur votre profil.</p>
    </div>
    <button class="btn btn-outline" type="button" (click)="annuler()">Annuler</button>
  </div>

  @if (errorMessage()) {
    <div class="alert alert-error">{{ errorMessage() }}</div>
  }

  @if (loading()) {
    <p class="loading-state">Chargement...</p>
  } @else {
    <div class="card">
      <form [formGroup]="form" (ngSubmit)="enregistrer()">
        <div class="field-row">
          <div class="field">
            <label for="titre">Titre professionnel</label>
            <input id="titre" type="text" formControlName="titre" placeholder="Ex : Développeur Full-Stack" />
          </div>
          <div class="field">
            <label for="localisation">Localisation</label>
            <input id="localisation" type="text" formControlName="localisation" placeholder="Ville, Pays" />
          </div>
        </div>

        <div class="field">
          <label for="biographie">Biographie</label>
          <textarea id="biographie" rows="4" formControlName="biographie"></textarea>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="portfolio_url">Portfolio (URL)</label>
            <input id="portfolio_url" type="url" formControlName="portfolio_url" placeholder="https://..." />
          </div>
          <div class="field">
            <label for="linkedin_url">LinkedIn (URL)</label>
            <input id="linkedin_url" type="url" formControlName="linkedin_url" placeholder="https://linkedin.com/in/..." />
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="annees_experience">Années d'expérience</label>
            <input id="annees_experience" type="number" min="0" formControlName="annees_experience" />
          </div>
          <div class="field">
            <label for="disponibilite">Disponibilité</label>
            <select id="disponibilite" formControlName="disponibilite">
              <option value="disponible">Disponible</option>
              <option value="a_lecoute">À l'écoute d'opportunités</option>
              <option value="non_disponible">Non disponible</option>
            </select>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="type_contrat_souhaite">Contrat souhaité</label>
            <select id="type_contrat_souhaite" formControlName="type_contrat_souhaite">
              <option value="">Non précisé</option>
              <option value="temps_plein">Temps plein</option>
              <option value="temps_partiel">Temps partiel</option>
              <option value="freelance">Freelance</option>
              <option value="stage">Stage</option>
            </select>
          </div>
          <div class="field">
            <label for="type_lieu_souhaite">Lieu de travail souhaité</label>
            <select id="type_lieu_souhaite" formControlName="type_lieu_souhaite">
              <option value="">Non précisé</option>
              <option value="teletravail">Télétravail</option>
              <option value="hybride">Hybride</option>
              <option value="presentiel">Présentiel</option>
            </select>
          </div>
        </div>

        <button class="btn btn-primary" type="submit" [disabled]="saving()">
          {{ saving() ? 'Enregistrement...' : 'Enregistrer' }}
        </button>
      </form>
    </div>
  }
</div>
