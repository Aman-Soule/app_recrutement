<header class="header">
  <button class="header__hamburger" type="button" aria-label="Menu" (click)="layoutUi.toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
    </svg>
  </button>

  <div class="header__spacer"></div>

  <div class="header__actions">
    <button class="header__bell" type="button" aria-label="Notifications">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path
          d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
        <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke-linecap="round" />
      </svg>
      @if (nonLus() > 0) {
        <span class="header__badge">{{ nonLus() }}</span>
      }
    </button>

    <div class="header__user">
      <div class="header__identity">
        <span class="header__name">{{ user()?.name }}</span>
        <span class="header__role">{{ libelleRole() }}</span>
      </div>
      <div class="header__avatar">
        @if (avatarUrl()) {
          <img [src]="avatarUrl()" alt="" />
        } @else {
          {{ initiales() }}
        }
      </div>
    </div>

    <button class="header__logout" type="button" (click)="seDeconnecter()" title="Se déconnecter">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" stroke-linecap="round" />
        <path d="M16 17l5-5-5-5" stroke-linecap="round" stroke-linejoin="round" />
        <path d="M21 12H9" stroke-linecap="round" />
      </svg>
    </button>
  </div>
</header>
