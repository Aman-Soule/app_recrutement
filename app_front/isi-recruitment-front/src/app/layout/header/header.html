<header class="header">
  <button class="header__hamburger" type="button" aria-label="Menu" (click)="layoutUi.toggleSidebar()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M4 6h16M4 12h16M4 18h16" stroke-linecap="round" />
    </svg>
  </button>

  <div class="header__spacer"></div>

  <div class="header__actions">
    <div class="header__notif-wrap">
      <button
        class="header__bell"
        type="button"
        aria-label="Notifications"
        (click)="toggleNotifications()"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path
            d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <path d="M13.7 21a2 2 0 0 1-3.4 0" stroke-linecap="round" />
        </svg>
        @if (notificationsNonLues() > 0) {
          <span class="header__badge">{{ notificationsNonLues() }}</span>
        }
      </button>

      @if (panneauOuvert()) {
        <div class="notif-panel">
          <div class="notif-panel__header">
            <h3>Notifications</h3>
            <button type="button" (click)="toutMarquerLu()">Tout marquer comme lu</button>
          </div>
          <div class="notif-panel__list">
            @for (notification of notifications(); track notification.id) {
              <button
                type="button"
                class="notif-item"
                [class.unread]="!notification.read_at"
                (click)="ouvrirNotification(notification)"
              >
                <p class="notif-item__titre">{{ notification.data.titre }}</p>
                <p class="notif-item__message">{{ notification.data.message }}</p>
              </button>
            } @empty {
              <p class="notif-panel__empty">Aucune notification pour l'instant.</p>
            }
          </div>
        </div>
      }
    </div>

    <button class="header__bell" type="button" aria-label="Messages" (click)="irVersMessages()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
        <path
          d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-4 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1Z"
          stroke-linecap="round"
          stroke-linejoin="round"
        />
      </svg>
      @if (nonLus() > 0) {
        <span class="header__badge">{{ nonLus() }}</span>
      }
    </button>

    <div class="header__user">
      <div class="header__identity">
        <span class="header__name">{{ user()?.name }}</span>
        <span class="header__role">{{ libelleRole() }}</span>
      </div>
      <div class="header__avatar">
        @if (avatarUrl(); as url) {
          <img [src]="url" alt="" (click)="imagePreview.open(url)" />
        } @else {
          {{ initiales() }}
        }
      </div>
    </div>
  </div>
</header>
